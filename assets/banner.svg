<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title">
  <title id="title">0x36D76289 — cypherpunk · systems · security</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1a1f1a" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff88"/>
      <stop offset="1" stop-color="#00d1ff"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, "DejaVu Sans Mono", monospace; }
      .dim { fill: #5c6b5f; }
      .txt { fill: #e6ede7; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .line { opacity: 0; animation: show .01s forwards; }
      .l1 { animation-delay: .3s; } .l2 { animation-delay: 1.1s; } .l3 { animation-delay: 1.9s; }
      .scan { animation: scan 6s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes show { to { opacity: 1; } }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(280px); } }
    </style>
  </defs>

  <rect width="900" height="240" rx="12" fill="#0a0d0a"/>
  <rect width="900" height="240" rx="12" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="900" height="40" fill="#39ff88" opacity=".035"/>

  <!-- window chrome -->
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <text x="450" y="27" text-anchor="middle" class="mono dim" font-size="13">0x36D76289@42paris: ~</text>

  <!-- identity -->
  <text x="48" y="104" class="mono" font-size="54" font-weight="700" fill="url(#fade)">0x36D76289</text>
  <text x="50" y="138" class="mono txt" font-size="18">cypherpunk · systems · security</text>

  <!-- terminal lines -->
  <g class="mono" font-size="15">
    <text x="50" y="176" class="line l1"><tspan fill="#39ff88">$</tspan><tspan class="txt"> cargo run --release --bin kfs</tspan></text>
    <text x="50" y="200" class="line l2 dim">[  0.000000] GDT loaded · IDT loaded · paging enabled</text>
    <text x="50" y="224" class="line l3"><tspan fill="#39ff88">$</tspan><tspan class="cursor txt"> █</tspan></text>
  </g>

  <!-- hex fingerprint -->
  <g class="mono dim" font-size="12" text-anchor="end">
    <text x="860" y="84">75E9 F067 AFB3 071D</text>
    <text x="860" y="102">513E BCE7 32A9 148D</text>
    <text x="860" y="120">044E BD21</text>
  </g>
</svg>
